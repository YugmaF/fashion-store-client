sonar.projectKey=fashion-store-client
sonar.projectName=fashion-store-client
sonar.projectVersion=0.1.0

sonar.sources=src
sonar.exclusions=**/node_modules/**,**/build/**,src/serviceWorker.js,src/**/*.test.js,src/images/**,src/assets/**
sonar.tests=src
sonar.test.inclusions=src/**/*.test.js
sonar.sourceEncoding=UTF-8
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.coverage.exclusions=src/serviceWorker.js,src/setupTests.js,src/index.js
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300
